reason = "starlette is pulled in only via slurm-emulator (a dev/test-only dependency of the slurm plugin) through fastapi 0.128.7, which pins starlette<1.0. The fix is in starlette 1.0.1, a major upgrade unreachable without bumping fastapi. starlette is never used in production code; the Host-header path-validation flaw has no exposure here."
