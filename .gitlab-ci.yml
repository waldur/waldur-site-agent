# Avoid running two full pipelines for every MR-branch push. Job rules here match
# both `$CI_COMMIT_BRANCH` and `merge_request_event`, so an MR branch push used to
# spawn a redundant branch pipeline AND the merge-request pipeline for the same
# SHA (~2x CI cost on every active MR). Branch pipelines are therefore limited to
# `main`; feature branches are tested through their merge request. Pushing a
# branch *before* opening its MR no longer triggers a pipeline either (that gap
# used to cost a full run per new branch). Tags, scheduled runs, upstream
# triggers and pipelines started from the web UI / API still run normally, as
# does a push with `-o ci.variable=RUN_E2E=true` (the E2E escape hatch).
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$RUN_E2E == "true"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main"'
      when: never
    - when: always

variables:
  COMPONENT_VERSION: "latest"
  # pre-commit hook environments are cached below; the dir must live inside
  # $CI_PROJECT_DIR to be cacheable.
  PRE_COMMIT_HOME: $CI_PROJECT_DIR/.cache/pre-commit

# No uv cache: the runner cache is local-only and never hit by the test jobs
# (every trace showed "Cache file does not exist"), while a cold
# `uv sync --all-packages` takes ~5-10s. The former ".pre" cache-priming job also
# serialised every pipeline behind itself for no benefit.

# Helm linting and validation
Lint helm chart:
  image:
    name: "registry.hpc.ut.ee/mirror/alpine/helm:3.12.3"
    entrypoint: [""]
  stage: test
  interruptible: true
  needs: []
  rules:
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: $CI_COMMIT_TAG
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - helm/**/*
  before_script:
    - apk update
    - apk add jq python3
    - apk add -X http://dl-cdn.alpinelinux.org/alpine/edge/community -u alpine-keys
    - apk add yq --repository=http://dl-cdn.alpinelinux.org/alpine/edge/community
    - helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 1.0.2
  script:
    - helm lint helm/waldur-site-agent/
    - helm lint helm/waldur-site-agent/ -f helm/waldur-site-agent/test-values.yaml
    - helm lint helm/waldur-site-agent/ -f helm/waldur-site-agent/test-values-event.yaml
    - helm unittest helm/waldur-site-agent/
    - helm template waldur-site-agent helm/waldur-site-agent/ --debug
    - helm template waldur-site-agent helm/waldur-site-agent/ -f helm/waldur-site-agent/test-values.yaml --debug
    - helm template waldur-site-agent helm/waldur-site-agent/ -f helm/waldur-site-agent/test-values-event.yaml --debug
    - mkdir rendered-templates && helm template waldur-site-agent helm/waldur-site-agent/ --output-dir rendered-templates/ --debug
    - mkdir -p rendered-templates/test-polling && helm template waldur-site-agent helm/waldur-site-agent/ -f helm/waldur-site-agent/test-values.yaml --output-dir rendered-templates/test-polling/ --debug
    - mkdir -p rendered-templates/test-event && helm template waldur-site-agent helm/waldur-site-agent/ -f helm/waldur-site-agent/test-values-event.yaml --output-dir rendered-templates/test-event/ --debug
  artifacts:
    expire_in: 1 week
    when: always
    paths:
      - rendered-templates

# ---------------------------------------------------------------------------
# Unit tests
#
# Interpreter matrix: merge requests run only the supported floor and ceiling
# (3.9, 3.13); the three interpreters in between run on main, tags and
# scheduled pipelines via the "(3.10-3.12)" companion jobs. Suites are split into
# three jobs -- core, slurm (the two long ones) and one job that loops over every
# other plugin -- because the per-job overhead (runner prep + uv sync, ~30s) used
# to exceed the pytest time of most plugin suites, and half a dozen plugins with
# tests had no CI job at all.
# ---------------------------------------------------------------------------

.mr_python_versions: &mr_python_versions ["3.9", "3.13"]
.extra_python_versions: &extra_python_versions ["3.10", "3.11", "3.12"]

.Run tests base:
  stage: test
  interruptible: true
  needs: []
  # script_failure is included because `uv sync` occasionally dies on a
  # uv/hatchling build race; the cost is one wasted re-run when a test failure
  # is real.
  retry: &uv_flake_retry
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - script_failure
  image: "registry.hpc.ut.ee/mirror/library/python:$PYTHON_VERSION"
  parallel:
    matrix:
      - PYTHON_VERSION: *mr_python_versions
  coverage: "/TOTAL.+ ([0-9]{1,3}%)/"
  before_script:
    - cp examples/waldur-site-agent-config.yaml.example ./waldur-site-agent-config.yaml
    - pip install uv
    - uv sync --all-packages
    - source .venv/bin/activate
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report*.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Rules shared by the "(3.10-3.12)" companion jobs: on merge requests only when
# the pipeline definition itself changes, so a CI edit that breaks them cannot
# reach main unexercised.
.full_matrix_rules: &full_matrix_rules
  - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
    when: never
  - if: '$CI_COMMIT_BRANCH == "main"'
  - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(-rc\.\d+)?$/'
  - if: '$CI_PIPELINE_SOURCE == "schedule"'
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    changes:
      - .gitlab-ci.yml

.Core tests:
  extends: .Run tests base
  script:
    - pytest --cov=waldur_site_agent --cov-report=xml --cov-report=term --junitxml=report.xml tests/

Run core tests:
  extends: .Core tests
  rules:
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(-rc\.\d+)?$/'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - tests/**/*
        - waldur_site_agent/**/*
        - pyproject.toml
        - uv.lock
        - .gitlab-ci.yml

Run core tests (3.10-3.12):
  extends: .Core tests
  parallel:
    matrix:
      - PYTHON_VERSION: *extra_python_versions
  rules: *full_matrix_rules

.Slurm tests:
  extends: .Run tests base
  script:
    - cd plugins/slurm
    - pytest --cov=waldur_site_agent_slurm --cov-report=xml:$CI_PROJECT_DIR/coverage.xml --cov-report=term --junitxml=$CI_PROJECT_DIR/report.xml tests/ --ignore=tests/e2e

Run slurm tests:
  extends: .Slurm tests
  rules:
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(-rc\.\d+)?$/'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - plugins/slurm/**/*
        - waldur_site_agent/**/*
        - pyproject.toml
        - uv.lock
        - .gitlab-ci.yml

Run slurm tests (3.10-3.12):
  extends: .Slurm tests
  parallel:
    matrix:
      - PYTHON_VERSION: *extra_python_versions
  rules: *full_matrix_rules

# Every plugin except slurm, run one after another from inside its own directory
# (entry points only resolve reliably that way -- see CLAUDE.md). A failure in
# one plugin does not stop the others; the job fails at the end and the summary
# names the offenders. e2e/ directories are gated by env vars anyway but are
# skipped outright to keep collection cheap.
.Plugin tests:
  extends: .Run tests base
  script:
    - |
      failed=""
      for tests_dir in plugins/*/tests; do
        plugin_dir=$(dirname "$tests_dir")
        plugin=$(basename "$plugin_dir")
        [ "$plugin" = "slurm" ] && continue
        package=$(cd "$plugin_dir" && ls -d waldur_site_agent_* 2>/dev/null | head -1)
        echo ""
        echo "=================== $plugin ==================="
        if ! (cd "$plugin_dir" && pytest --cov="${package:-.}" \
              --cov-report=xml:"$CI_PROJECT_DIR/coverage-$plugin.xml" --cov-report=term \
              --junitxml="$CI_PROJECT_DIR/report-$plugin.xml" tests/ --ignore=tests/e2e); then
          failed="$failed $plugin"
        fi
      done
      echo ""
      if [ -n "$failed" ]; then
        echo "FAILED plugin suites:$failed"
        exit 1
      fi
      echo "All plugin suites passed."
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report-*.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage-*.xml

Run plugin tests:
  extends: .Plugin tests
  rules:
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(-rc\.\d+)?$/'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - plugins/**/*
        - waldur_site_agent/**/*
        - pyproject.toml
        - uv.lock
        - .gitlab-ci.yml

Run plugin tests (3.10-3.12):
  extends: .Plugin tests
  parallel:
    matrix:
      - PYTHON_VERSION: *extra_python_versions
  rules: *full_matrix_rules

Scan Python dependencies:
  extends: .Vulnerability scan template
  variables:
    LOCKFILE_PATH: "uv.lock"

# Linters run once, on the newest interpreter. Only mypy is interpreter
# sensitive (ruff's target-version is pinned in pyproject.toml, the rest is
# YAML/Markdown/whitespace), so the supported floor gets a mypy-only job instead
# of a second full pre-commit run.
.Linters base:
  extends: .Run linters template
  image: "registry.hpc.ut.ee/mirror/library/python:$PYTHON_VERSION"
  needs: []
  # Keyed per interpreter: the two linter jobs run concurrently and would
  # otherwise overwrite each other's hook environments.
  cache:
    key:
      prefix: "pre-commit-py$PYTHON_VERSION"
      files:
        - .pre-commit-config.yaml
    paths:
      - .cache/pre-commit
  before_script:
    - |
      echo 'default_language_version:' >> .pre-commit-config.yaml
      echo "  python: python$PYTHON_VERSION" >> .pre-commit-config.yaml

Run linters:
  extends: .Linters base
  variables:
    PYTHON_VERSION: "3.13"

Run mypy (3.9):
  extends: .Linters base
  variables:
    PYTHON_VERSION: "3.9"
  script:
    - pip install pre-commit
    - pre-commit run --all-files mypy

# E2E integration tests: boot a minimal Waldur stack (PostgreSQL + RabbitMQ +
# Mastermind API/Worker) via Docker-in-Docker, load the site_agent_e2e demo
# preset, then run the SLURM emulator E2E test suite against it.
#
# The suites are spread over three jobs that each boot their own stack, because
# a single serial job took ~21 min on the MR critical path (setup ~3 min, tests
# ~17 min). The stack boot, preset load and auth token live in before_script;
# each job's script only runs pytest. The 11-config QoS matrix (5+ min on its
# own, "defense-in-depth" over the same policy code that "E2E: policy, QoS &
# LDAP" covers) runs on main and tags but not on merge requests.
.E2E base:
  image: "registry.hpc.ut.ee/mirror/library/python:3.11"
  stage: test
  interruptible: true
  needs: []
  # Same uv-flake / infrastructure retry as .Run tests base — this job also
  # runs `uv sync` and is not covered by that template.
  retry: *uv_flake_retry
  services:
    - name: "docker:24.0-dind"
      command: ["--mtu=1400"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    DOCKER_REGISTRY_PREFIX: "registry.hpc.ut.ee/mirror/"
    WALDUR_MASTERMIND_IMAGE_TAG: "latest"
    # Common pytest environment; each job adds the WALDUR_E2E_*_CONFIG variables
    # its test files read. Every test file reads exactly one config variable, so
    # all suites of a job run in a single pytest invocation (one interpreter
    # start + collection instead of one per suite).
    WALDUR_E2E_TESTS: "true"
    WALDUR_E2E_PROJECT_A_UUID: "e2eb0000000000000000000000000001"
    # The E2E runs are not coverage-gated and coverage tracing adds ~65% to the
    # agent code that runs between API calls, so the root addopts (--cov) are
    # cleared for these jobs.
    E2E_PYTEST: "pytest -o addopts= -v"
  before_script:
    # Install Docker CLI + Compose plugin (static binaries)
    - apt-get update -qq && apt-get install -y -qq curl
    - curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz | tar xz -C /usr/local/bin --strip-components=1 docker/docker
    - mkdir -p ~/.docker/cli-plugins
    - curl -fsSL https://github.com/docker/compose/releases/download/v2.32.4/docker-compose-linux-x86_64 -o ~/.docker/cli-plugins/docker-compose
    - chmod +x ~/.docker/cli-plugins/docker-compose
    - docker compose version
    # Install Python dependencies (core + all plugins including slurm-emulator)
    - pip install uv
    - uv sync --all-packages
    - cp examples/waldur-site-agent-config.yaml.example ./waldur-site-agent-config.yaml
    # Boot the minimal Waldur stack, load the demo preset and set the auth token.
    - docker compose -f ci/docker-compose.e2e.yml pull
    - docker compose -f ci/docker-compose.e2e.yml up waldur-db-migration
    - docker compose -f ci/docker-compose.e2e.yml up -d
    - docker compose -f ci/docker-compose.e2e.yml ps
    # Guard against the RabbitMQ `transient_nonexcl_queues` deprecation
    # crash-looping the Celery worker. RabbitMQ 4.3 denies transient,
    # non-exclusive queues by default -- the combination kombu's pidbox and
    # Celery's gossip queues declare unless the mastermind image sets
    # CELERY_CONTROL_QUEUE_EXCLUSIVE / CELERY_EVENT_QUEUE_EXCLUSIVE. This
    # guards both sides: the broker conf and the image.
    #
    # Polls rather than sleeping a fixed interval -- the worker connects,
    # runs mingle, and only then declares the pidbox queue, so on a loaded
    # runner the failure can surface well after a short sleep.
    - |
      COMPOSE="docker compose -f ci/docker-compose.e2e.yml"
      echo "Waiting for waldur-worker to start cleanly against RabbitMQ..."
      worker_ready=""
      for _ in $(seq 1 18); do
        logs=$($COMPOSE logs waldur-worker 2>&1 || true)
        case "$logs" in
          *transient_nonexcl_queues*)
            echo "ERROR: RabbitMQ rejected a Celery queue declaration (transient_nonexcl_queues)."
            echo "Either the broker is missing deprecated_features.permit.transient_nonexcl_queues,"
            echo "or the mastermind image predates the exclusive control-plane queue settings."
            echo "$logs"
            exit 1
            ;;
        esac
        if $COMPOSE ps --status exited --status dead --services | grep -qx waldur-worker; then
          echo "ERROR: waldur-worker container stopped during startup."
          $COMPOSE ps -a waldur-worker
          echo "$logs"
          exit 1
        fi
        case "$logs" in
          *" ready."*)
            worker_ready=1
            break
            ;;
        esac
        sleep 5
      done
      if [ -z "$worker_ready" ]; then
        echo "ERROR: waldur-worker did not report ready within 90s."
        $COMPOSE ps -a waldur-worker
        $COMPOSE logs waldur-worker
        exit 1
      fi
      echo "waldur-worker started cleanly."
    # Wait for Waldur API to be ready (401 = up but unauthenticated, which is expected)
    - |
      echo "Waiting for Waldur API..."
      for i in $(seq 1 60); do
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://docker:8080/api/ 2>/dev/null || echo "000")
        if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "200" ]; then
          echo "Waldur API ready (HTTP $HTTP_CODE, attempt $i)"
          break
        fi
        if [ "$i" -eq 60 ]; then
          echo "ERROR: Waldur API not ready after 60 attempts (last HTTP $HTTP_CODE)"
          docker compose -f ci/docker-compose.e2e.yml logs
          exit 1
        fi
        sleep 5
      done
    # Copy demo preset into container and load it
    - |
      API_CONTAINER=$(docker compose -f ci/docker-compose.e2e.yml ps -q waldur-api)
      PRESETS_DIR=$(docker compose -f ci/docker-compose.e2e.yml exec -T waldur-api \
        find /usr/src -path "*/demo_presets/presets" -type d | head -1 | tr -d '\r')
      echo "Presets directory: ${PRESETS_DIR}"
      docker cp ci/site_agent_e2e.json ${API_CONTAINER}:${PRESETS_DIR}/site_agent_e2e.json
      docker compose -f ci/docker-compose.e2e.yml exec -T waldur-api waldur demo_presets load site_agent_e2e --no-cleanup
    # Force-set the deterministic auth token (preset load skips it if user already has one)
    - |
      docker compose -f ci/docker-compose.e2e.yml exec -T waldur-api waldur shell -c "
      from rest_framework.authtoken.models import Token
      from django.contrib.auth import get_user_model
      User = get_user_model()
      u = User.objects.get(username='e2e-staff')
      Token.objects.filter(user=u).delete()
      Token.objects.create(user=u, key='e2e0000000000000000000000000token001')
      print('Token set successfully')
      "
  after_script:
    - docker compose -f ci/docker-compose.e2e.yml logs > waldur-stack-logs.txt 2>&1 || true
    - docker compose -f ci/docker-compose.e2e.yml down || true
  artifacts:
    when: always
    reports:
      junit: e2e-report-*.xml
    paths:
      - waldur-stack-logs.txt
      - plugins/slurm/tests/e2e/*-report.md
      - plugins/slurm/tests/e2e/*-report.json
    expire_in: 1 week

# Rules for the E2E jobs that run on merge requests.
.e2e_mr_rules: &e2e_mr_rules
  - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
    when: never
  - if: '$CI_PIPELINE_SOURCE == "schedule"'
    when: never
  - if: '$RUN_E2E_TESTS && $CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$RUN_E2E_TESTS && $CI_COMMIT_BRANCH == "main"'
  - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(-rc\.\d+)?$/'
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    changes:
      - plugins/slurm/**/*
      - plugins/ldap/**/*
      - waldur_site_agent/**/*
      - ci/**/*
      - pyproject.toml
      - uv.lock
      - .gitlab-ci.yml
  - if: '$RUN_E2E == "true"'

"E2E: REST & STOMP":
  extends: .E2E base
  rules: *e2e_mr_rules
  variables:
    WALDUR_E2E_CONFIG: ci/e2e-ci-config.yaml
    WALDUR_E2E_STOMP_CONFIG: ci/e2e-ci-config-stomp.yaml
    WALDUR_E2E_BENCH_RESOURCES: "5"
  script:
    # REST suite (stomp_enabled=false), then STOMP (stomp_enabled=true) and the
    # QoS backwards-compatibility file. Files are listed explicitly rather than
    # via --ignore so that a new test_e2e_*.py gated on another job's config
    # variable is not silently collected here and skipped green; a new file must
    # be wired into exactly one job.
    - |
      source .venv/bin/activate
      $E2E_PYTEST --junitxml=e2e-report-rest.xml \
        plugins/slurm/tests/e2e/test_e2e_api_optimizations.py \
        plugins/slurm/tests/e2e/test_e2e_benchmark.py \
        plugins/slurm/tests/e2e/test_e2e_default_account_policy.py \
        plugins/slurm/tests/e2e/test_e2e_order_reconciliation.py \
        plugins/slurm/tests/e2e/test_e2e_partition_associations.py \
        plugins/slurm/tests/e2e/test_e2e_prepaid.py \
        plugins/slurm/tests/e2e/test_e2e_resources_sync.py \
        plugins/slurm/tests/e2e/test_e2e_rest_api.py \
        plugins/slurm/tests/e2e/test_e2e_restore.py \
        plugins/slurm/tests/e2e/test_e2e_stomp.py \
        plugins/slurm/tests/e2e/test_e2e_qos_backcompat.py

"E2E: policy, QoS & LDAP":
  extends: .E2E base
  rules: *e2e_mr_rules
  variables:
    WALDUR_E2E_POLICY_CONFIG: ci/e2e-ci-config-policy.yaml
    WALDUR_E2E_STOMP_CONFIG: ci/e2e-ci-config-stomp.yaml
    WALDUR_E2E_LDAP_CONFIG: ci/e2e-ci-config-ldap.yaml
    # Only this job needs the OpenLDAP container (compose profile "ldap").
    COMPOSE_PROFILES: ldap
  script:
    # Wait for OpenLDAP to be ready
    - |
      echo "Waiting for OpenLDAP..."
      for i in $(seq 1 30); do
        if docker compose -f ci/docker-compose.e2e.yml exec -T waldur-ldap \
          ldapsearch -x -H ldap://localhost -b "dc=sofiatech,dc=bg" \
          -D "cn=admin,dc=sofiatech,dc=bg" -w "e2e-ldap-password" > /dev/null 2>&1; then
          echo "OpenLDAP ready (attempt $i)"
          break
        fi
        if [ "$i" -eq 30 ]; then
          echo "ERROR: OpenLDAP not ready after 30 attempts"
          docker compose -f ci/docker-compose.e2e.yml logs waldur-ldap
          exit 1
        fi
        sleep 2
      done
    # Policy suite (11 SLURM policy configurations), QoS-flow polling path,
    # QoS-flow STOMP path (RESOURCE event -> agent -> emulator), LDAP suite.
    - |
      source .venv/bin/activate
      $E2E_PYTEST --junitxml=e2e-report-policy-qos-ldap.xml \
        plugins/slurm/tests/e2e/test_e2e_policy.py \
        plugins/slurm/tests/e2e/test_e2e_qos_polling.py \
        plugins/slurm/tests/e2e/test_e2e_qos_stomp.py \
        plugins/slurm/tests/e2e/test_e2e_ldap.py

"E2E: QoS matrix":
  extends: .E2E base
  rules:
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$RUN_E2E_TESTS && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(-rc\.\d+)?$/'
    - if: '$RUN_E2E_TESTS && $CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$RUN_E2E == "true"'
  variables:
    WALDUR_E2E_POLICY_CONFIG: ci/e2e-ci-config-policy.yaml
  script:
    # QoS matrix across all 11 policy configs
    - |
      source .venv/bin/activate
      $E2E_PYTEST --junitxml=e2e-report-qos-matrix.xml \
        plugins/slurm/tests/e2e/test_e2e_qos_matrix.py

# Lints the published opennode/waldur-site-agent:latest image from Docker Hub --
# never the merge request's own content -- so there is nothing for it to verify
# on an MR. It runs where the image can actually have changed.
Lint docker image:
  extends: .Lint docker image template
  needs: []
  variables:
    IMAGE: opennode/waldur-site-agent:latest
  rules:
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(-rc\.\d+)?$/'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

Lint dockerfile:
  extends: .Lint dockerfile template
  variables:
    DOCKERFILE: Dockerfile
    HADOLINT_CONFIG: |
      ignored:
        - DL3018 # "versions for `apk add`" warning
        - DL3008 # "versions for `apt-get install`" warning
        - DL3009 # "Delete apt-get lists" warning (handled in same RUN)

