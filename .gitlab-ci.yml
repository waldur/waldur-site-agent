# Posts the CHANGELOG.md entry for the tag to Slack, to the same channels the
# platform release is announced in. Runs in postdeploy behind the publish jobs,
# so a tag whose artifacts never reached PyPI, the chart repository or Docker
# Hub announces nothing.
#
# The `latest` image job only exists for stable tags, so it is depended on
# optionally — otherwise every candidate would be blocked on a job that its own
# pipeline never creates.
Announce release on Slack:
  extends: .Announce release on Slack template
  stage: postdeploy
  needs:
    - job: "Publish python module tagged release with uv"
    - job: "Publish new chart version and update docs on github"
    - job: "Publish multiarch waldur-site-agent docker image with version"
    - job: "Publish multiarch waldur-site-agent docker image latest"
      optional: true
  variables:
    SLACK_PRODUCT_NAME: "Waldur Site Agent"
    # CHANGELOG.md is not synced into waldur-docs, so the link points at the
    # GitHub mirror, whose heading anchors keep the ' - ' as three hyphens.
    SLACK_CHANGELOG_URL: "https://github.com/waldur/waldur-site-agent/blob/main/CHANGELOG.md"
    SLACK_ANCHOR_STYLE: "github"

# Fails when a dependency arrives under a licence Waldur cannot ship — strong
# copyleft (GPL, AGPL), source-available (SSPL, BUSL, Elastic) or non-OSI
# use-restricted (Hippocratic, JSON). LGPL and MPL pass but stay listed in the
# job artifact. See waldur/waldur-mastermind#285.
#
# The job only runs on merge requests that touch pyproject.toml or uv.lock, plus
# the default branch and release tags.
#
# allow_failure is inherited as true from the template, so this cannot redden an
# MR while it is being adopted. Override it with `allow_failure: false` to make
# the gate binding once this repo is known clean.
Check dependency licences:
  extends: .Licence gate (python) template
