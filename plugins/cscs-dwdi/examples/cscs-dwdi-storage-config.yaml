# Storage usage from CSCS-DWDI. Run with: waldur_site_agent -m report -c <file>

offerings:
  - name: "CSCS storage usage"
    waldur_api_url: "https://waldur.example.com/api/"
    waldur_api_token: "<waldur api token>"
    waldur_offering_uuid: "<offering uuid>"
    backend_type: "cscs-dwdi-storage"
    reporting_backend: "cscs-dwdi-storage"
    backend_settings:
      cscs_dwdi_api_url: "https://dwdi.example.com"
      cscs_dwdi_client_id: "<oidc client id>"
      cscs_dwdi_client_secret: "<oidc client secret>"
      cscs_dwdi_oidc_token_url: "https://auth.example.com/realms/example/protocol/openid-connect/token"
      cscs_dwdi_oidc_scope: "openid"
      # socks_proxy: "socks5://localhost:12345"   # when the API is only reachable through a tunnel
      storage_filesystem: "lustre"
      storage_data_type: "projects"
      storage_tenant: "example"
      # Waldur resource backend id -> storage path
      storage_path_mapping:
        "project_123": "/store/projects/proj123"
    backend_components:
      storage_space:
        measured_unit: "GB"
        unit_factor: 0.000000001   # bytes -> GB
        accounting_type: "usage"
        label: "Storage Space (GB)"
      storage_inodes:
        measured_unit: "count"
        unit_factor: 1
        accounting_type: "usage"
        label: "File Count"
