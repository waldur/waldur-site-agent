[project]
name = "waldur-site-agent-k8s-ut-namespace"
version = "1.0.8rc13"
description = "Kubernetes ManagedNamespace plugin (backends `k8s-namespace`, `k8s-ut-namespace`) for Waldur Site Agent"
authors = [{ name = "OpenNode Team", email = "info@opennodecloud.com" }]
requires-python = ">=3.9.2, <4"
dependencies = [
    "waldur-site-agent>=1.0.8rc13",
    "waldur-site-agent-keycloak-client>=1.0.8rc13",
    "kubernetes>=28.0.0,<32.0.0",
    # Prometheus consumption billing talks to the HTTP API directly.
    "httpx>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
waldur-site-agent = { workspace = true }
waldur-site-agent-keycloak-client = { workspace = true }

# Entry points for exporting backends
[project.entry-points."waldur_site_agent.backends"]
k8s-ut-namespace = "waldur_site_agent_k8s_ut_namespace.backend:K8sUtNamespaceBackend"
# The same backend under a deployment-neutral name: the ManagedNamespace operator is
# not specific to one site. A subclass rather than the same class, so the raw
# processor class path stored in Waldur (module.ClassName) and the backend_type in
# core log lines name the entry point the offering chose. Anything Waldur derives
# from that path uses only the package, so it still reads k8s-ut-namespace. The old name stays registered, so
# existing configurations keep working untouched.
k8s-namespace = "waldur_site_agent_k8s_ut_namespace.backend:K8sNamespaceBackend"

[project.entry-points."waldur_site_agent.backend_settings_schemas"]
k8s-ut-namespace = "waldur_site_agent_k8s_ut_namespace.schemas:K8sUtNamespaceBackendSettingsSchema"
# Both names read the same settings, so they share one schema class: the core
# validates each distinct schema class once per offering, however many names
# register it.
k8s-namespace = "waldur_site_agent_k8s_ut_namespace.schemas:K8sUtNamespaceBackendSettingsSchema"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
]
