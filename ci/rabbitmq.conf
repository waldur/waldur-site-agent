cluster_partition_handling = ignore
default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*
log.console = true
default_vhost = /
listeners.tcp.default = 5672
management.tcp.ip = 0.0.0.0
management.tcp.port = 15672
loopback_users = none
disk_free_limit.absolute = 500MB

# RabbitMQ 4.3 compatibility: 4.3 denies transient, non-exclusive queues by
# default, the combination kombu's pidbox and Celery's gossip queues declare.
# Mastermind now declares both exclusive (CELERY_CONTROL_QUEUE_EXCLUSIVE /
# CELERY_EVENT_QUEUE_EXCLUSIVE), so this flag is only needed when running an
# older mastermind image. It is read at node boot and is accepted on 4.1, 4.2
# and 4.3 alike, so it can be set or removed at any point in the version walk.
deprecated_features.permit.transient_nonexcl_queues = true
