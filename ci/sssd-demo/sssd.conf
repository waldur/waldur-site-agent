[sssd]
config_file_version = 2
services = nss, pam
domains = waldur

[nss]
# The directory holds only Waldur-managed accounts, so nothing needs filtering
# beyond the usual local root protection SSSD applies by default.

[pam]

[domain/waldur]
id_provider = ldap
auth_provider = ldap
ldap_uri = ldap://waldur-ldap:389
ldap_search_base = dc=sofiatech,dc=bg

# The agent writes real posixAccount/posixGroup entries keyed on uid, so the
# stock RFC2307 schema applies and none of the attribute overrides a GLAuth
# directory needs are required here.
ldap_schema = rfc2307
ldap_user_search_base = ou=People,dc=sofiatech,dc=bg
ldap_group_search_base = ou=Groups,dc=sofiatech,dc=bg

# Simple bind as the directory admin: this is a demo directory with no anonymous
# read. A real deployment would use a dedicated read-only service account.
ldap_default_bind_dn = cn=admin,dc=sofiatech,dc=bg
ldap_default_authtok = e2e-ldap-password

# Demo-only: no TLS on the wire, and caching off so each check reflects the
# directory as it stands right now rather than a cached answer.
ldap_auth_disable_tls_never_use_in_production = true
enumerate = true
cache_credentials = false
entry_cache_timeout = 1
