suite: service account
templates:
  - templates/serviceaccount.yaml
release:
  name: test-release
  namespace: test-ns
tests:
  - it: should not render service account by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render service account when create is enabled
    set:
      serviceAccount.create: true
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: test-release-waldur-site-agent
      - isNotEmpty:
          path: metadata.labels["helm.sh/chart"]

  - it: should use custom name when set
    set:
      serviceAccount.create: true
      serviceAccount.name: waldur-site-agent
    asserts:
      - equal:
          path: metadata.name
          value: waldur-site-agent

  - it: should apply annotations when set
    set:
      serviceAccount.create: true
      serviceAccount.annotations:
        example.com/owner: hpc
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: hpc

  - it: should not set annotations by default
    set:
      serviceAccount.create: true
    asserts:
      - isNull:
          path: metadata.annotations
